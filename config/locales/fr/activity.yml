fr:
  activity:
    kinds:
      key_added:
        label: Clé ajoutée
        description: Une clé du trousseau a été ajoutée sur un serveur.
      key_removed:
        label: Clé supprimée
        description: Une clé a été supprimée d'un compte depuis Elio.
      key_expired:
        label: Accès temporaire expiré
        description: Un accès temporaire a expiré et sa clé a été retirée.
      unknown_key_detected:
        label: Clé inconnue détectée
        description: Une clé absente du trousseau a été trouvée sur un serveur.
      key_disappeared:
        label: Clé retirée hors d'Elio
        description: Une clé a disparu d'un serveur sans passer par Elio.
      ssh_access_lost:
        label: Accès SSH perdu
        description: Le serveur refuse désormais la clé d'Elio.
      host_key_changed:
        label: Empreinte serveur remplacée
        description: Un administrateur a accepté la nouvelle empreinte d'un serveur (réinstallation…).
      server_unreachable:
        label: Serveur injoignable
        description: Un serveur ne répond plus sur son port SSH.
      server_back_online:
        label: Serveur de nouveau joignable
        description: Un serveur injoignable répond à nouveau.
      os_upgraded:
        label: Système mis à niveau
        description: La version du système d'un serveur a changé (inventaire).
      server_rebooted:
        label: Serveur redémarré
        description: Un serveur a redémarré depuis le dernier inventaire.
      health_warning:
        label: Serveur à surveiller
        description: La santé d'un serveur se dégrade (disque, mémoire, charge, redémarrage requis…).
      health_critical:
        label: Serveur en état critique
        description: Un seuil critique est dépassé sur un serveur (disque ou mémoire presque pleins…).
      health_recovered:
        label: Serveur de nouveau sain
        description: Un serveur à surveiller ou critique est revenu à la normale.
      packages_changed:
        label: Paquets modifiés
        description: Des paquets ont été installés, mis à jour ou supprimés sur un serveur (inventaire).
      service_failed:
        label: Service en échec
        description: Un service systemd est passé en échec (inventaire).
      service_recovered:
        label: Service rétabli
        description: Un service systemd en échec fonctionne à nouveau.
      container_stopped:
        label: Conteneur arrêté
        description: Un conteneur Docker qui tournait s'est arrêté.
      container_started:
        label: Conteneur redémarré
        description: Un conteneur Docker arrêté tourne à nouveau.
      scheduled_task_failed:
        label: Tâche planifiée en échec
        description: Le dernier passage d'un timer systemd a échoué (inventaire).
      scheduled_task_late:
        label: Tâche planifiée en retard
        description: Un timer systemd n'a pas tourné depuis plus de deux fois sa période.
      vulnerability_found:
        label: Vulnérabilité corrigeable
        description: Une vulnérabilité (CVE) grave et corrigeable touche un serveur ou une de ses images Docker (gravité choisie dans les paramètres).
      vulnerability_feed_failed:
        label: Base de vulnérabilités non mise à jour
        description: Le téléchargement ou l'import d'une base de vulnérabilités a échoué (signalé une fois, jusqu'au retour à la normale).
      container_unhealthy:
        label: Conteneur en mauvaise santé
        description: Le healthcheck d'un conteneur Docker échoue (alerte au choix dans Paramètres → Docker).
      container_restarting:
        label: Conteneur qui redémarre en boucle
        description: Un conteneur Docker redémarre sans cesse (alerte au choix dans Paramètres → Docker).
      image_update_available:
        label: Nouvelle version d'image
        description: Le registre publie une nouvelle version d'une image Docker utilisée (alerte au choix dans Paramètres → Docker).
      port_opened:
        label: Port public ouvert
        description: Un nouveau port écoute sur une adresse publique d'un serveur.
      port_closed:
        label: Port public fermé
        description: Un port public n'écoute plus sur un serveur.
      ip_address_added:
        label: Nouvelle adresse IP publique
        description: Une adresse IP publique apparaît sur une interface d'un serveur.
      ip_address_removed:
        label: Adresse IP publique retirée
        description: Une adresse IP publique n'est plus configurée sur un serveur.
      security_updates_available:
        label: Mises à jour de sécurité
        description: Des mises à jour de sécurité sont disponibles sur un serveur qui n'en avait pas.
      server_created:
        label: Serveur ajouté
        description: Un serveur a été ajouté à Elio.
      server_updated:
        label: Serveur modifié
        description: Les informations de connexion d'un serveur ont changé.
      servers_imported:
        label: Serveurs importés
        description: Des serveurs ont été importés depuis un fichier CSV ou un ~/.ssh/config.
      server_deleted:
        label: Serveur supprimé
        description: Un serveur a été retiré d'Elio (ses clés restent installées dessus).
      server_group_created:
        label: Groupe de serveurs créé
        description: Un groupe de serveurs a été créé.
      server_group_deleted:
        label: Groupe de serveurs supprimé
        description: Un groupe de serveurs a été supprimé (ses serveurs restent).
      user_invited:
        label: Utilisateur invité
        description: Une invitation à rejoindre Elio a été créée.
      invitation_accepted:
        label: Invitation acceptée
        description: Un nouvel utilisateur a rejoint Elio.
      invitation_revoked:
        label: Invitation révoquée
        description: Une invitation en attente a été annulée.
      user_role_changed:
        label: Rôle modifié
        description: Le rôle d'un utilisateur a changé.
      user_deactivated:
        label: Utilisateur désactivé
        description: 'Un compte a été désactivé : il ne peut plus se connecter.'
      user_reactivated:
        label: Utilisateur réactivé
        description: Un compte désactivé peut de nouveau se connecter.
      user_locked:
        label: Compte verrouillé
        description: 'Trop d''essais de connexion ratés : le compte est bloqué 15 minutes.'
      two_factor_enabled:
        label: 2FA activée
        description: Un utilisateur a activé la double authentification.
      two_factor_disabled:
        label: 2FA désactivée
        description: La double authentification d'un utilisateur a été désactivée ou réinitialisée.
      two_factor_backup_code_used:
        label: Code de secours utilisé
        description: Un utilisateur s'est connecté avec un code de secours.
      public_key_created:
        label: Clé ajoutée au trousseau
        description: Une clé a été ajoutée au trousseau.
      public_key_deleted:
        label: Clé retirée du trousseau
        description: Une clé a été retirée du trousseau (elle reste sur les serveurs).
      ssh_key_generated:
        label: Clé Elio générée
        description: La clé SSH d'Elio a été générée ou régénérée.
      ssh_key_rotation_started:
        label: Rotation de la clé Elio lancée
        description: Une nouvelle clé Elio est en cours d'installation sur les serveurs.
      ssh_key_rotated:
        label: Clé Elio remplacée
        description: 'La rotation est terminée : la nouvelle clé Elio est active, l''ancienne supprimée.'
      automation_run:
        label: Automatisation exécutée
        description: Une automatisation s'est exécutée.
      monitor_down:
        label: Sonde hors ligne
        description: Une sonde Uptime Kuma rattachée à un serveur est hors ligne (option de l'extension).
      monitor_up:
        label: Sonde de retour
        description: Une sonde Uptime Kuma hors ligne répond de nouveau.
      monitor_cert_expiring:
        label: Certificat bientôt expiré
        description: Le certificat vérifié par une sonde Uptime Kuma expire bientôt.
      server_without_monitor:
        label: Serveur sans sonde
        description: Un serveur n'est surveillé par aucune sonde Uptime Kuma.
      ovh_service_expiring:
        label: Service OVH bientôt expiré
        description: Un service OVHcloud (dédié, VPS) arrive à expiration.
      dns_record_outside_fleet:
        label: DNS vers une IP hors du parc
        description: Un enregistrement DNS OVH pointe vers une IP qui n'est à aucun serveur du parc.
      ovh_service_unmanaged:
        label: Service OVH non suivi
        description: Un service OVHcloud n'est rattaché à aucun serveur du parc.
      integration_enabled:
        label: Extension activée
        description: Un administrateur a activé une extension.
      integration_disabled:
        label: Extension désactivée
        description: Un administrateur a désactivé une extension.
      integration_sync_failed:
        label: Échec de synchronisation d'une extension
        description: Une extension n'arrive plus à lire son service (signalé une fois, jusqu'au retour à la normale).
    categories:
      keys: Clés SSH
      servers: Serveurs
      security: Sécurité
      configuration: Configuration
    system: Système
    unnamed: sans nom
    target: "« %{server_name} »"
