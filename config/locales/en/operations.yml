en:
  automation:
    kinds:
      health_check:
        label: Health check
        description: Reads the load, memory, disks, pending updates and failed services; keeps 30 days of history.
      servers_ping:
        label: Servers check
        description: Checks that each server answers on its SSH port and reports those that no longer answer.
      inventory_os:
        label: System inventory
        description: Reads again the distribution, kernel, machine and its IP addresses; reports upgrades, reboots and public addresses that change.
      inventory_packages:
        label: Packages inventory
        description: Reads again the installed packages and available updates; reports new security updates.
      inventory_services:
        label: Services inventory
        description: Reads again the systemd services, Docker (containers, images and their vulnerabilities) and scheduled tasks (cron, timers); reports those that go down or fail.
      inventory_ports:
        label: Ports inventory
        description: Reads again the listening ports and the firewall; reports public ports that open.
      vulnerabilities_update:
        label: Vulnerabilities update
        description: Downloads the vulnerability feeds (Debian Security Tracker, Ubuntu) for the releases of the fleet and matches them with the installed packages.
      cve_scores_update:
        label: CVE severity scores
        description: Asks the score providers (NVD, Red Hat, CVE.org, EPSS, CISA KEV…) for the score of the fleet's CVEs not scored yet, and derives the severity of those the distribution does not rate.
      docker_image_updates:
        label: Docker image updates
        description: Asks the registries (Docker Hub, GHCR…) for the latest version of each image used on the fleet, read-only.
      keys_scan:
        label: Key scan
        description: Reads the keys of every server and reports unknown or missing keys.
      uptime_kuma_sync:
        label: Uptime Kuma sync
        description: Reads again the Uptime Kuma monitors, attaches them to the servers and raises the alerts chosen in the extension.
      ovh_sync:
        label: OVHcloud sync
        description: Reads again the OVHcloud resources (IPs, firewall, DNS, services), attaches them to the servers and raises the chosen alerts.
    intervals:
      i5: Every 5 minutes
      i15: Every 15 minutes
      i60: Every hour
      i360: Every 6 hours
      i1440: Every day
