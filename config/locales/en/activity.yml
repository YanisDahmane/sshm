      new:
        title: Add a notification channel
  notification_channels_controller:
    created: The channel “%{channel_name}” has been added. Send a test to check it.
    updated: The channel “%{channel_name}” has been updated.
    deleted: The channel “%{channel_name}” has been deleted.
    test_sent: Test message sent to “%{channel_name}”.
    test_failed: 'Delivery to “%{channel_name}” failed: %{message}'
