# Every command Elio runs on the servers, over SSH. This file is the only
# place they are written: the services load them through Ssh::Commands
# (Ssh::Connection#run_command), so what is here is exactly what runs.
#
# Layout: role → command → variants.
#
#   <role>:
#     <command>:
#       description: what it is for (shown in the README and the tests)
#       writes: true          # changes something on the server (only keys.*); everything else is read-only
#       run_as: root          # needs root: prefixed with `sudo -n` when Elio logs in through sudo
#                             # (see connection.sudo_probe), run as is when it logs in as root,
#                             # and still run (with partial results) without root
#       timeout: 60           # seconds (default 60)
#       shell: true           # multi-line script, sent as `sh -c '<script>'`
#       default: |            # the command, for any system
#       debian: |             # variant for this distribution family: matched against ID, then
#                             # ID_LIKE of /etc/os-release (connection.os_release): "debian"
#                             # also covers Ubuntu, Raspbian…
#
# Values are inserted with @{name}, always shell-escaped (Shellwords) by
# Ssh::Commands: a value can never break out of its word.
# Output sections are separated by "@@elio <name>" lines, read by the parsers.

connection:
  sudo_probe:
    description: "Can root commands run through sudo without a password? Checked once per session (not when logged in as root)."
    timeout: 10
    default: "sudo -n true"

  check:
    description: "Login test of the server page: echoes a random token."
    timeout: 10
    default: "echo @{token}"

  os_release:
    description: "Distribution family (ID and ID_LIKE), to pick the variant of the commands that have one. Read once per session, only when needed."
    timeout: 10
    default: ". /etc/os-release 2>/dev/null && echo \"$ID $ID_LIKE\""

inventory:
  os:
    description: "System: distribution, kernel, host name, virtualization, uptime, processors, memory, time zone."
    shell: true
    default: |
      echo "@@elio os-release"; cat /etc/os-release 2>/dev/null || cat /usr/lib/os-release 2>/dev/null
      echo "@@elio uname"; uname -srm
      echo "@@elio hostname"; hostname -f 2>/dev/null || hostname
      echo "@@elio virt"; systemd-detect-virt 2>/dev/null || true
      echo "@@elio uptime"; cat /proc/uptime
      echo "@@elio cpus"; nproc 2>/dev/null || getconf _NPROCESSORS_ONLN
      echo "@@elio meminfo"; grep -E '^MemTotal:' /proc/meminfo
      echo "@@elio timezone"; timedatectl show -p Timezone --value 2>/dev/null || cat /etc/timezone 2>/dev/null || true

  network:
    description: "Network: interfaces and their addresses (iproute2, JSON)."
    shell: true
    default: |
      echo "@@elio addr"; ip -j addr 2>/dev/null || echo unsupported
      echo "@@elio link"; ip -d -j link 2>/dev/null || true

  health:
    description: "Health: load, memory, disks (space and inodes), reboot required, failed units, pending updates, clock sync."
    shell: true
    debian: |
      excluded="-x tmpfs -x devtmpfs -x overlay -x squashfs -x efivarfs -x ramfs -x nsfs"
      echo "@@elio loadavg"; cat /proc/loadavg
      echo "@@elio cpus"; nproc 2>/dev/null || getconf _NPROCESSORS_ONLN
      echo "@@elio meminfo"; grep -E '^(MemTotal|MemAvailable|SwapTotal|SwapFree):' /proc/meminfo
      echo "@@elio df"; df -P -T -k $excluded 2>/dev/null
      echo "@@elio inodes"; df -P -T -i $excluded 2>/dev/null
      echo "@@elio reboot"; if [ -f /var/run/reboot-required ]; then echo yes; else echo no; fi
      echo "@@elio failed"; systemctl --failed --no-legend --plain 2>/dev/null || true
      echo "@@elio updates"; apt-get -s -o Debug::NoLocking=true dist-upgrade 2>/dev/null | grep '^Inst ' || true
      echo "@@elio ntp"; timedatectl show -p NTPSynchronized --value 2>/dev/null || true
    default: |
      excluded="-x tmpfs -x devtmpfs -x overlay -x squashfs -x efivarfs -x ramfs -x nsfs"
      echo "@@elio loadavg"; cat /proc/loadavg
      echo "@@elio cpus"; nproc 2>/dev/null || getconf _NPROCESSORS_ONLN
      echo "@@elio meminfo"; grep -E '^(MemTotal|MemAvailable|SwapTotal|SwapFree):' /proc/meminfo
      echo "@@elio df"; df -P -T -k $excluded 2>/dev/null
      echo "@@elio inodes"; df -P -T -i $excluded 2>/dev/null
      echo "@@elio reboot"; if [ -f /var/run/reboot-required ]; then echo yes; else echo no; fi
      echo "@@elio failed"; systemctl --failed --no-legend --plain 2>/dev/null || true
      echo "@@elio updates"; echo unsupported
      echo "@@elio ntp"; timedatectl show -p NTPSynchronized --value 2>/dev/null || true

  packages:
    description: "Packages: dpkg packages (with their source package, for the CVE feeds) and the available updates (security ones flagged), snaps, Docker presence."
    shell: true
    debian: |
      echo "@@elio dpkg"; dpkg-query -W -f='${db:Status-Abbrev}\t${Package}\t${Version}\t${Architecture}\t${source:Package}\t${source:Version}\n' 2>/dev/null
      echo "@@elio upgradable"; apt list --upgradable 2>/dev/null
      echo "@@elio snap"; if command -v snap >/dev/null 2>&1; then snap list 2>/dev/null; else echo unsupported; fi
      echo "@@elio docker"; if command -v docker >/dev/null 2>&1; then echo present; fi
    default: |
      echo "@@elio dpkg"; echo unsupported
      echo "@@elio upgradable"
      echo "@@elio snap"; if command -v snap >/dev/null 2>&1; then snap list 2>/dev/null; else echo unsupported; fi
      echo "@@elio docker"; if command -v docker >/dev/null 2>&1; then echo present; fi

  docker_images:
    description: "Docker images (needs the docker group or root)."
    run_as: root
    default: "docker image ls --format '{{.Repository}}\t{{.Tag}}\t{{.ID}}'"

  services:
    description: "Services: systemd units (state, enabled at boot), Docker presence."
    shell: true
    default: |
      echo "@@elio units"; systemctl list-units --type=service --all --no-legend --plain --no-pager 2>/dev/null || echo unsupported
      echo "@@elio unit-files"; systemctl list-unit-files --type=service --no-legend --plain --no-pager 2>/dev/null || true
      echo "@@elio docker"; if command -v docker >/dev/null 2>&1; then echo present; fi

  docker_containers:
    description: "Docker containers with their Compose project (labels set by Docker Compose; needs the docker group or root)."
    run_as: root
    default: "docker ps -a --no-trunc --format '{{.ID}}\t{{.Names}}\t{{.Image}}\t{{.State}}\t{{.Status}}\t{{.Ports}}\t{{.Label \"com.docker.compose.project\"}}\t{{.Label \"com.docker.compose.project.working_dir\"}}\t{{.Label \"com.docker.compose.project.config_files\"}}\t{{.Label \"com.docker.compose.service\"}}'"

  scheduled_tasks:
    description: "Scheduled tasks: system crontabs (/etc/crontab, /etc/cron.d, cron.hourly…monthly scripts), users' crontabs (root only), systemd timers with their last run and its result."
    run_as: root
    shell: true
    default: |
      echo "@@elio crontab"; cat /etc/crontab 2>/dev/null || true
      echo "@@elio cron.d"; for f in /etc/cron.d/*; do [ -f "$f" ] || continue; echo "@@file $f"; cat "$f" 2>/dev/null; done
      echo "@@elio periodic"; for d in hourly daily weekly monthly; do for f in /etc/cron.$d/*; do if [ -f "$f" ] && [ -x "$f" ]; then echo "$d ${f##*/}"; fi; done; done
      echo "@@elio users"; for dir in /var/spool/cron/crontabs /var/spool/cron; do
        [ -d "$dir" ] || continue
        if ! ls "$dir" >/dev/null 2>&1; then echo unreadable; break; fi
        for f in "$dir"/*; do [ -f "$f" ] || continue; echo "@@file ${f##*/}"; cat "$f" 2>/dev/null; done; break
      done
      echo "@@elio timers"; if command -v systemctl >/dev/null 2>&1; then
        for t in $(systemctl list-units --type=timer --all --no-legend --plain --no-pager 2>/dev/null | awk '{print $1}'); do
          props="-p Id -p Description -p Unit -p ActiveState -p UnitFileState -p TimersCalendar -p TimersMonotonic -p LastTriggerUSec -p NextElapseUSecRealtime"
          systemctl show "$t" --timestamp=unix $props 2>/dev/null || systemctl show "$t" $props 2>/dev/null
          unit=$(systemctl show "$t" -p Unit --value 2>/dev/null)
          if [ -n "$unit" ]; then systemctl show "$unit" -p Result -p ExecMainStatus 2>/dev/null | sed 's/^/Service/'; fi
          echo
        done
      else echo unsupported; fi

  ports:
    description: "Ports: listening sockets with their process and systemd unit, firewall state (ufw, else nftables, else iptables). Read-only: Elio never changes the firewall."
    run_as: root
    shell: true
    default: |
      echo "@@elio ss"; ss -H -tulpn 2>/dev/null || ss -H -tuln 2>/dev/null || echo unsupported
      echo "@@elio cgroups"; for pid in $(ss -H -tulpn 2>/dev/null | grep -o 'pid=[0-9]*' | cut -d= -f2 | sort -u); do printf '%s ' "$pid"; head -n 1 "/proc/$pid/cgroup" 2>/dev/null || echo; done
      echo "@@elio ufw"; if command -v ufw >/dev/null 2>&1; then ufw status verbose 2>&1; else echo absent; fi
      echo "@@elio nft"; if command -v nft >/dev/null 2>&1; then nft list ruleset 2>&1 | head -c 200000; else echo absent; fi
      echo "@@elio iptables"; if command -v iptables >/dev/null 2>&1; then iptables -S INPUT 2>&1; else echo absent; fi

# The only commands that change something: the authorized_keys file of the
# account Elio logs in as (~/.ssh/authorized_keys), when a key is added,
# replaced or removed from Elio. Other lines are kept byte for byte, the file
# keeps its owner and permissions.
keys:
  read:
    description: "Reads ~/.ssh/authorized_keys (a missing file means no keys)."
    shell: true
    default: |
      set -e
      file="$HOME/.ssh/authorized_keys"
      if [ -f "$file" ]; then cat "$file"; fi

  append:
    description: "Adds a key line unless its key is already there (creates ~/.ssh in 700 and the file in 600). Prints present or added."
    writes: true
    shell: true
    default: |
      set -e
      umask 077
      mkdir -p "$HOME/.ssh"
      file="$HOME/.ssh/authorized_keys"
      touch "$file"
      if grep -qF -- @{blob} "$file"; then
        echo present
      else
        if [ -s "$file" ] && [ -n "$(tail -c 1 "$file")" ]; then echo >> "$file"; fi
        printf '%s\n' @{line} >> "$file"
        echo added
      fi

  replace:
    description: "Replaces the lines of a key by a new line (changes or removes a temporary access expiry). Prints added."
    writes: true
    shell: true
    default: |
      set -e
      umask 077
      mkdir -p "$HOME/.ssh"
      file="$HOME/.ssh/authorized_keys"
      touch "$file"
      tmp=$(mktemp "$HOME/.ssh/authorized_keys.XXXXXX")
      trap 'rm -f "$tmp"' EXIT
      awk -v blob=@{blob} '{ for (i = 1; i <= NF; i++) if ($i == blob) next; print }' "$file" > "$tmp"
      cat "$tmp" > "$file"
      if [ -s "$file" ] && [ -n "$(tail -c 1 "$file")" ]; then echo >> "$file"; fi
      printf '%s\n' @{line} >> "$file"
      echo added

  remove:
    description: "Removes every line whose key is the given one. Prints absent or removed."
    writes: true
    shell: true
    default: |
      set -e
      file="$HOME/.ssh/authorized_keys"
      if [ ! -f "$file" ]; then echo absent; exit 0; fi
      matches=$(awk -v blob=@{blob} '{ for (i = 1; i <= NF; i++) if ($i == blob) { n++; break } } END { print n + 0 }' "$file")
      if [ "$matches" -eq 0 ]; then echo absent; exit 0; fi
      tmp=$(mktemp "$HOME/.ssh/authorized_keys.XXXXXX")
      trap 'rm -f "$tmp"' EXIT
      awk -v blob=@{blob} '{ for (i = 1; i <= NF; i++) if ($i == blob) next; print }' "$file" > "$tmp"
      cat "$tmp" > "$file"
      echo removed
