name: Release

# On a version tag (v0.1.0-beta.1): the Docker image on ghcr.io (amd64 and
# arm64), then the GitHub release with the notes of CHANGELOG.md. A tag with
# a suffix (-beta.1, -rc.1) is a pre-release: tagged "beta", never "latest".
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: The tag matches Elio::VERSION
        run: |
          version=$(sed -n 's/.*VERSION = "\(.*\)".*/\1/p' lib/elio/version.rb)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME, but lib/elio/version.rb says $version"; exit 1; }

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=beta,enable=${{ contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.title=Elio
            org.opencontainers.image.description=Self-hosted fleet manager for Linux servers: agentless, read-only, over SSH.
            org.opencontainers.image.licenses=AGPL-3.0-only

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v version="$version" '
            $0 ~ "^## \\[" version "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[[^]]+\]: / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "No section for $version in CHANGELOG.md"; exit 1; }
          cat >> notes.md <<NOTES

          ## Install

          \`\`\`sh
          docker pull ghcr.io/${GITHUB_REPOSITORY}:${version}
          \`\`\`

          With PostgreSQL: see the quick start of the [README](https://github.com/${GITHUB_REPOSITORY}#quick-start).
          NOTES

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; *) flags="--latest" ;; esac
          gh release create "$GITHUB_REF_NAME" --title "Elio ${GITHUB_REF_NAME#v}" --notes-file notes.md --verify-tag $flags
